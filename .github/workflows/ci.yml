name: CI and development image

on:
  push:
    branches: [dev, 'fix/**', 'feat/**', 'test/**', 'ci/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/ci/tests/scan-images.test.mjs
      - run: npx --no-install prisma generate
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
      - run: npm run build

  image-security:
    uses: ./.github/workflows/image-security.yml

  image:
    needs: [validate, image-security]
    if: github.repository == 'xfdzcoder/mailhub' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          load: true
          tags: mailhub-smoke:runtime
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mailhub
          cache-to: type=gha,mode=max,scope=mailhub
      - name: Build migration tool
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrate
          load: true
          tags: mailhub-smoke:migrate
          cache-from: type=gha,scope=mailhub
      - name: Verify migrations, Web and Worker
        run: bash scripts/ci/smoke.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag mailhub-smoke:runtime "$IMAGE:sha-$REVISION"
          docker tag mailhub-smoke:runtime "$IMAGE:dev"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:dev"
          DIGEST=$(docker image inspect "$IMAGE:sha-$REVISION" --format '{{index .RepoDigests 0}}')
          echo "Published: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
