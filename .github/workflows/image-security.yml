name: Final image security and compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build final runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          load: true
          tags: mailhub-smoke:runtime
          cache-from: type=gha,scope=mailhub
      - name: Build final migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrate
          load: true
          tags: mailhub-smoke:migrate
          cache-from: type=gha,scope=mailhub
      - name: Verify generated client, migrations, Web and Worker
        id: smoke
        run: bash scripts/ci/smoke.sh
      - name: Install scanner
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false
      - name: Inventory and scan both final images
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        env:
          IMAGE_EVIDENCE_DIR: ${{ runner.temp }}/mailhub-image-security-evidence
        run: bash scripts/ci/scan-images.sh
      - name: Preserve image identities, installed paths and findings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-image-security-evidence
          path: ${{ runner.temp }}/mailhub-image-security-evidence/
          if-no-files-found: error
          retention-days: 14
